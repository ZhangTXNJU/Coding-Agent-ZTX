[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A self-built coding agent (harness) driven by OpenAI-compatible native tool calling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "rich>=13.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
